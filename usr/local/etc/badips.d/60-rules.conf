# ============================================================================
# Default rules for role mode (bad-ips 4.0)
#
# Read ONLY when a role is set (role = block | report). The legacy daemon
# ignores [rule:*] sections, and role mode ignores the [detector:*],
# [Plugins:*] and [PublicBlocklistPlugins:*] sections in the other files.
#
# A rule only runs where its source file exists, so one rule set serves every
# host: the nginx rules do nothing on a mail server and the mail rules do
# nothing on a web proxy.
#
# Every pattern pins the client address, (?<ip>...), to a FIXED place in the
# line. Never write a pattern that takes "the first address on the line": the
# attacker controls usernames, URLs and user agents, and could otherwise get
# any address they like banned.
#
# To change a rule, redefine the whole [rule:NAME] section in a later file
# (e.g. 95-site.conf). A later section with the same name replaces this one;
# "active = 0" there switches it off.
# ============================================================================

# Bots probing for files no visitor ever asks for. Field 1 of nginx's
# combined log is $remote_addr, the connection's own address.
[rule:nginx-probe]
source  = /var/log/nginx/access.log, /var/log/nginx/catchall.log
format  = nginx
match   = ^(?<ip>[0-9A-Fa-f.:]+) \S+ \S+ \[[^\]]+\] "[A-Z]+ /(?:[A-Za-z0-9_.-]+/)?(?:\.env|\.git/|wp-login\.php|xmlrpc\.php|(?i:phpmyadmin)|cgi-bin/|vendor/phpunit|\.aws/|actuator|boaform|HNAP1)
count   = 3
window  = 600
ban     = 604800
service = http

# "Not found" floods against names that are not one of our sites. Counted
# only in the catch-all server's own log, which by construction holds no
# requests for real sites (a busy real user reaches ~35 per 10 minutes).
[rule:nginx-catchall-flood]
source  = /var/log/nginx/catchall.log
format  = nginx
match   = ^(?<ip>[0-9A-Fa-f.:]+) \S+ \S+ \[[^\]]+\] "[^"]*" 404(?=\s)
count   = 50
window  = 600
ban     = 86400
service = http

# Failed SMTP logins, including bots trying mechanisms we never offer. The
# client is the name[address] straight after "warning: ", where postfix
# alone writes it.
[rule:postfix-auth]
source  = /var/log/mail.log
format  = rfc3339
match   = ^\S+ \S+ postfix/(?:submission/|smtps/)?smtpd\[\d+\]: warning: [^\s\[\]]+\[(?<ip>[0-9A-Fa-f.:]+)\]: SASL \S+ authentication failed
count   = 5
window  = 600
ban     = 3600
service = smtp

# The same failures counted over a day, for patient guessers. Measured on the
# fleet (2026-10-28..11-02): the worst SMTP guesser made 408 attempts over
# five days at ~3 an hour and never reached the fast rule's 5 in 10 minutes;
# others made 13-18 a day. A person with a stale password does not fail ten
# SMTP logins in a day.
[rule:postfix-auth-slow]
source  = /var/log/mail.log
format  = rfc3339
match   = ^\S+ \S+ postfix/(?:submission/|smtps/)?smtpd\[\d+\]: warning: [^\s\[\]]+\[(?<ip>[0-9A-Fa-f.:]+)\]: SASL \S+ authentication failed
count   = 10
window  = 86400
ban     = 86400
service = smtp

# SMTP protocol abuse: non-SMTP traffic (TLS/RDP probes), pipelining before
# the greeting, and open-relay attempts. Only "Relay access denied" counts
# among RCPT rejects; a mistyped recipient from a real mail server does not.
[rule:postfix-abuse]
source  = /var/log/mail.log
format  = rfc3339
match   = ^\S+ \S+ postfix/(?:submission/|smtps/)?smtpd\[\d+\]: (?:improper command pipelining after \S+ from [^\s\[\]]+\[(?<ip>[0-9A-Fa-f.:]+)\]:|warning: non-SMTP command from [^\s\[\]]+\[(?<ip>[0-9A-Fa-f.:]+)\]:|NOQUEUE: reject: RCPT from [^\s\[\]]+\[(?<ip>[0-9A-Fa-f.:]+)\]: 554 5\.7\.1 <[^>]*>: Relay access denied;)
count   = 3
window  = 600
ban     = 86400
service = smtp

# Failed IMAP/POP3 logins. One line covers a whole connection and says how
# many attempts it made, so (?<n>...) weights it. The username comes BEFORE
# rip= and is attacker-controlled, so the greedy ".*, rip=" takes the LAST
# rip= on the line, which dovecot itself writes.
[rule:dovecot-auth]
source  = /var/log/mail.log
format  = rfc3339
match   = ^\S+ \S+ dovecot: (?:imap|pop3|submission|managesieve)-login: [^(]*\(auth failed, (?<n>\d+) attempts? in \d+ secs?\).*, rip=(?<ip>[0-9A-Fa-f.:]+), lip=
count   = 5
window  = 600
ban     = 3600
service = imap

# Failed SSH logins, read from the ssh.service journal (the first shipped
# rules with a journal source: the pattern sees the bare message, and the
# time comes from the journal entry). OpenSSH 10 on Debian 13 (sshd-session)
# writes the client as the LAST "ADDRESS port N" on the line, after the
# username, so every alternative takes the address from the END of the line
# and nothing typed into a username can plant one.
#
# Counted: a wrong password, an unknown user, a client that gives up while
# authenticating, a non-SSH banner. NOT counted, on purpose:
#   * a client that connects and leaves before authenticating ("Connection
#     closed by ADDRESS port N [preauth]", "Connection reset by ...",
#     "Received disconnect ..."): not an attacker, it is how a port scanner,
#     a banner probe and an impatient SSH client all look -- and it is what
#     the house's own phones do all day;
#   * "Failed publickey": an agent holding several keys fails the first few
#     on every connection and sshd logs the third one on, so an owner with
#     six keys would ban themselves in two connections;
#   * "Failed none": the client's normal first probe, logged only for an
#     unknown user, which the "Invalid user" line already counts;
#   * PAM's "authentication failure": the Failed-password line already
#     counts that attempt.
[rule:sshd-auth]
journal = ssh.service
format  = journal
match   = ^(?:Failed (?:password|keyboard-interactive(?:/pam)?) for (?:invalid user )?.* from (?<ip>[0-9A-Fa-f.:]+) port \d+(?: ssh2)?$|Invalid user .* from (?<ip>[0-9A-Fa-f.:]+) port \d+$|Connection closed by (?:authenticating|invalid) user .* (?<ip>[0-9A-Fa-f.:]+) port \d+ \[preauth\]$|banner exchange: Connection from (?<ip>[0-9A-Fa-f.:]+) port \d+: invalid format$)
count   = 4
window  = 600
ban     = 21600
service = ssh

# The same failures counted over a day, for patient guessers (as for SMTP).
[rule:sshd-auth-slow]
journal = ssh.service
format  = journal
match   = ^(?:Failed (?:password|keyboard-interactive(?:/pam)?) for (?:invalid user )?.* from (?<ip>[0-9A-Fa-f.:]+) port \d+(?: ssh2)?$|Invalid user .* from (?<ip>[0-9A-Fa-f.:]+) port \d+$|Connection closed by (?:authenticating|invalid) user .* (?<ip>[0-9A-Fa-f.:]+) port \d+ \[preauth\]$|banner exchange: Connection from (?<ip>[0-9A-Fa-f.:]+) port \d+: invalid format$)
count   = 10
window  = 86400
ban     = 86400
service = ssh

# ============================================================================
# Public blocklist (block role only). Spamhaus DROP: networks hijacked or
# leased to criminals, which Spamhaus advises dropping outright. EDROP was
# merged into DROP in 2024. Fetched at most once a day (Spamhaus asks for no
# more than hourly) and cached; never written to the shared ban list.
# ============================================================================
[feed:spamhaus-drop]
urls        = https://www.spamhaus.org/drop/drop.txt, https://www.spamhaus.org/drop/dropv6.txt
interval    = 86400
min_entries = 20
