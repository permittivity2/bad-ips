# SSH detection rules for bad-ips.
#
# Patterns are "description:::regex". Two kinds are recognised:
#
#   bad_login_pattern_NN   - evidence of an attack; counts toward a block.
#   good_login_pattern_NN  - evidence a real user authenticated. Checked
#                            FIRST, and the matching address is then exempt
#                            from blocking for good_login_grace seconds.
#
# The good patterns matter: a successful login followed seconds later by a
# harmless pre-auth disconnect (connection sharing, an editor's remote
# plugin, a flaky mobile link) used to be enough to lock out the legitimate
# user, because the daemon had no concept of a successful login at all.

[Plugins:GeneralLogMonitor]
active = 1
name = SSH
log_paths = /var/log/auth.log, /var/log/secure
fetch_interval = 2
initial_fetch = 7200
use_cache = 1
journal_unit = ssh.service, sshd.service
monitor_method = auto

# --- evidence a real user got in -------------------------------------------
good_login_pattern_01 = Accepted publickey:::Accepted publickey for .* from
good_login_pattern_02 = Accepted password:::Accepted password for .* from
good_login_pattern_03 = Accepted keyboard-interactive:::Accepted keyboard-interactive(?:/pam)? for .* from
good_login_pattern_04 = Accepted GSSAPI:::Accepted gssapi(?:-with-mic)? for .* from

# How long a successful login protects an address. Default 3600.
good_login_grace = 3600

# --- evidence of an attack --------------------------------------------------
bad_login_pattern_01 = Failed password:::Failed password for .* from
bad_login_pattern_02 = Invalid user:::Invalid user .* from
bad_login_pattern_03 = Authentication Failure:::pam_unix\(sshd:auth\): authentication failure
bad_login_pattern_04 = Did not receive identification string:::Did not receive identification string from
bad_login_pattern_05 = Timeout before authentication:::Timeout before authentication for connection from
bad_login_pattern_06 = No matching key exchange:::no matching key exchange method found
bad_login_pattern_07 = Weak KEX negotiation:::Unable to negotiate with .* diffie-hellman

# Deliberately NOT matched: a bare "Connection closed by <ip> [preauth]" or
# "Connection reset by <ip> [preauth]". Those are ordinary client disconnects
# during the handshake, not attacks, and matching them is what locked out real
# users. The variant below is kept because it names a username, which means an
# actual authentication attempt was made.
bad_login_pattern_08 = Preauth close after auth attempt:::Connection closed by authenticating user \S+ .* \[preauth\]
bad_login_pattern_09 = PAM unknown user:::pam_unix\(sshd:auth\): check pass; user unknown

# --- how many strikes before a block ---------------------------------------
# Counted per address within attempt_window seconds. Previously this setting
# was read from the config but never used by any code, so a single match
# blocked immediately; it is honoured as of 3.8.0.
block_after_n_attempts = 3
attempt_window = 600

# NOTE: a per-plugin "block_duration" is NOT implemented - how long a block
# lasts comes from the global "blocking_time" in badips.conf.
