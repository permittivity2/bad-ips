[detector:dovecot]
# active is optional; set to 0 to disable this detector. Defaults to enabled.
active = 1
units = dovecot.service
pattern1 = Aborted login
pattern2 = Disconnected.*rip=
pattern3 = Auth failed
pattern4 = Invalid user
pattern5 = imap-login: Disconnected.*rip=
pattern6 = pop3-login: Disconnected.*rip=
